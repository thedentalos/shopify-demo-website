</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div id="header-placeholder"></div>

  <main id="main-content" class="page-wrapper">
    <div class="container" style="padding-top: var(--spacing-xl); padding-bottom: var(--spacing-4xl);">
      <nav class="breadcrumb" aria-label="Breadcrumb" style="margin-bottom: var(--spacing-xl);">
        <ol class="breadcrumb__list">
          <li class="breadcrumb__item"><a href="index.html" class="breadcrumb__link">Home</a> <i data-feather="chevron-right" class="breadcrumb__separator"></i></li>
          <li class="breadcrumb__item breadcrumb__item--current" aria-current="page">Wishlist</li>
        </ol>
      </nav>

      <div class="section-header text-left" style="margin-bottom: var(--spacing-2xl);">
        <h1 class="section-header__title">My Wishlist <span id="wishlist-page-count" style="font-size: var(--font-size-lg); color: var(--color-text-muted); font-weight: 400;"></span></h1>
        <p>Your saved favorites ready to add to bag</p>
      </div>

      <!-- Wishlist Grid -->
      <div class="product-grid" id="wishlist-grid">
        <!-- Injected by wishlist.js -->
      </div>

      <!-- Empty Wishlist State -->
      <div class="no-results" id="wishlist-empty" style="display: none;">
        <i data-feather="heart" style="width: 56px; height: 56px; color: var(--color-text-muted); margin-bottom: 1.5rem;"></i>
        <h3>Your Wishlist is Empty</h3>
        <p>Save pieces you love by clicking the heart icon while browsing our catalog.</p>
        <a href="products.html" class="btn btn--primary btn--lg" style="margin-top: var(--spacing-lg);">Start Shopping</a>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
